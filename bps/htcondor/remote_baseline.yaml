# These are the default configs for running remote HTCondor workflows.
#
# Use it by adding
#
# includeConfigs:
#   - eups://drp_pipe/bps/htcondor/remote_defaults.yaml
#
# (with no outer indentation) to your BPS config file.

## TODO DM-56621: Replace eups:// with resource://

bpsBatchSubmission: true
bpsUseRunTempSpace: true
bpsUseShared: false
bpsMakeCommand: false
fileDistributionEndpoint: "${LSST_SHARED_SCRATCH_DIR}/bps/payload/{uniqProcName}/"

preparePayloadWorkflow:
  # The BPS_SUBMIT site runs on the k8s access point at USDF.  It's defined in
  # ctrl_bps_htcondor/python/lsst/ctrl/bps/htcondor/etc/htcondor_defaults.yaml.
  computeSite: BPS_SUBMIT
  postEnvSetup: ""

# Copy the .qg file from fileDistributionEndpoint to local scratch in
# ${LSST_LOCAL_SCRATCH_DIR}:
postEnvSetup: >-
  export shared_qg={fileDistributionEndpoint}{uniqProcName}.qg;
  echo shared_qg ${shared_qg};
  base_qg=`basename ${shared_qg}`;
  local_qg=${LSST_LOCAL_SCRATCH_DIR}/${base_qg};
  echo local_qg ${local_qg};
  if [ -f ${local_qg} ]; then
    echo The file exists.  No copy.;
  else
    echo The file does not exist.  Using gfal-copy to copy the file;
    echo gfal-copy ${shared_qg} ${local_qg}.$$.tmp;
    gfal-copy ${shared_qg} ${local_qg}.$$.tmp;
    ls -lart ${LSST_LOCAL_SCRATCH_DIR};
    ln ${local_qg}.$$.tmp ${local_qg};
  fi;
  ls -lart ${LSST_LOCAL_SCRATCH_DIR};

# Print out the runtime enviroment on the remote workers, while also
# explicitly disabling the .qg copy for buildQuantGraph.
buildQuantumGraph:
  postEnvSetup: "/usr/bin/env"

# Modify the various run commands to use the .qg file in ${LSST_LOCAL_SCRATCH_DIR}:
runQuantumCommand: pipetask {runPreCmdOpts} run-qbb {butlerConfig}
  ${LSST_LOCAL_SCRATCH_DIR}/{uniqProcName}.qg --qgraph-node-id {qgraphNodeId} {extraRunQuantumOptions}

pipetask:
  pipetaskInit:
    runQuantumCommand: pipetask {initPreCmdOpts} pre-exec-init-qbb {butlerConfig} ${LSST_LOCAL_SCRATCH_DIR}/{uniqProcName}.qg {extraInitOptions}

finalJob:
  command1: butler {finalPreCmdOpts} aggregate-graph ${LSST_LOCAL_SCRATCH_DIR}/{uniqProcName}.qg {butlerConfig} -j {requestCpus} --register-dataset-types {updateOutputChain} {extraAggregateOptions}
