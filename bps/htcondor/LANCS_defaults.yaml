# These are the default configs for running remote HTCondor workflows
# at LANCS.
#
# Use it by adding
#
# includeConfigs:
#   - eups://drp_pipe/bps/htcondor/LANCS_defaults.yaml
#
# (with no outer indentation) to your BPS config file.

## TODO DM-56621: Replace eups:// with resource://

includeConfigs:
  # Include baseline configs that apply to all remote sites.
  - eups://drp_pipe/bps/htcondor/remote_baseline.yaml
  # Clustering and caching for LANCS.
  - eups://drp_pipe/bps/clustering/LSSTCam/DRP-warp-coadd-clustering.yaml
  - eups://drp_pipe/bps/caching/LSSTCam/LANCS/DRP-caching.yaml

# Other site-specific configs.
site:
  LANCS:
    nodeset: "LANCS"
    memoryLimit: 1_536_000

computeSite: LANCS
