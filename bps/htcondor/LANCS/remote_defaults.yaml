# These are the default configs for running remote HTCondor workflows
# at LANCS.
#
# Use it by adding
#
# includeConfigs:
#   - ${DRP_PIPE_DIR}/bps/htcondor/LANCS/remote_defaults.yaml
#
# (with no outer indentation) to your BPS config file.
#
# Include baseline remote configs that apply to all sites.
includeConfigs:
  - ${DRP_PIPE_DIR}/bps/htcondor/remote_defaults.yaml

# Site-specific configs.
site:
  LANCS:
    nodeset: "LANCS"
    memoryLimit: 1_536_000

computeSite: LANCS
