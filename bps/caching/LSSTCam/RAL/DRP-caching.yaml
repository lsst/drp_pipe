# There are recommended configs for caching data while running at RAL.
#
# Use it by adding
#
#  includeConfigs:
#    - ${DRP_PIPE_DIR}/bps/caching/LSSTCam/RAL/DRP-caching.yaml
#
# (with no outer indentation) to your BPS config file.  This is meant
# to be used with the clustering definintions in
# ${DRP_PIPE_DIR}/bps/clustering/LSSTCam
#
# Including this file is incompatible with including any other caching or
# compression config yamls that set DAF_BUTLER_CONFIG_PATH (TODO DM-53875)

subDirTemplate: "{label}/{detector}"

environment:
  # Default caching config
  # Each pipetask creates its own local cache folder,
  # $TMPDIR/butler-cache-dir-*
  DAF_BUTLER_CONFIG_PATH: ${DRP_PIPE_DIR}/bps/caching/LSSTCam/RAL/config:${DAF_BUTLER_CONFIG_PATH}
  DAF_BUTLER_CACHE_EXPIRATION_MODE: datasets=2_000
