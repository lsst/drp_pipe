description: Match tract-level injected_deepCoadd_catalog datasets to objectTable_tract datasets.
instrument: lsst.obs.subaru.HyperSuprimeCam
imports:
  - location: resource://lsst.source.injection/resources/pipelines/match_injected_tract_catalog.yaml
  - location: resource://lsst.analysis.tools/resources/pipelines/coaddDiffMatchedInjectedCore.yaml
tasks:
  consolidateInjectedCatalogs:
    class: lsst.source.injection.utils.ConsolidateInjectedCatalogsTask
    config:
      connections.input_catalogs: '{injected_prefix}deepCoadd_catalog'
      connections.output_catalog: '{injected_prefix}deepCoadd_catalog_tract'
  matchObjectToInjected:
    class: lsst.pipe.tasks.match_tract_catalog.MatchTractCatalogTask
    config:
      connections.name_input_cat_ref: injected_deepCoadd_catalog_tract
      connections.name_input_cat_target: objectTable_tract

  analyze_matched_injected:
    class: lsst.analysis.tools.tasks.DiffMatchedAnalysisTask
    config:
      connections.inputName: matched_injected_deepCoadd_catalog_tract_objectTable_tract
      connections.outputName: matched_injected_deepCoadd_catalog_tract_objectTable_tract
      bands: ["r", "i"]
      python: |
        from lsst.analysis.tools.atools.diffMatched import reconfigure_diff_matched_defaults

        reconfigure_diff_matched_defaults(
          config=config,
          context="injection",
          key_flux_meas="psf",
          bands_color = {"r": "i"},
          use_any=False,
          use_galaxies=False,
        )
