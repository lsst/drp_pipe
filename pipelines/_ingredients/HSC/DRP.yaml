description: The DRP pipeline specialized for Subaru's HyperSuprime-Cam
instrument: lsst.obs.subaru.HyperSuprimeCam
imports:
  - location: resource://lsst.drp.pipe/resources/pipelines/_ingredients/DRP-full.yaml
    exclude:
      - consolidateSsTables
  - resource://lsst.analysis.tools/resources/pipelines/coaddColumnValidate.yaml
  - resource://lsst.analysis.tools/resources/pipelines/coaddQualityCore.yaml
  - resource://lsst.analysis.tools/resources/pipelines/exposureQualityCore.yaml
  - resource://lsst.analysis.tools/resources/pipelines/matchedVisitQualityCore.yaml
  - resource://lsst.analysis.tools/resources/pipelines/visitQualityCore.yaml
  - resource://lsst.analysis.tools/resources/pipelines/wholeSkyCore.yaml
tasks:
  isr:
    class: lsst.ip.isr.IsrTask
    config:
      doAmpOffset: true
      ampOffset.doApplyAmpOffset: true
  fgcmFitCycle:
    class: lsst.fgcmcal.fgcmFitCycle.FgcmFitCycleTask
    config:
      doMultipleCycles: true
  forcedPhotObjectDetector:
    class: lsst.pipe.tasks.forcedPhotDetector.ForcedPhotDetectorTask
    config:
      doDirectPhotometry: true
      doDifferencePhotometry: false
  # Turn off applyAstrometricCorrections unless fitStellarMotion is turned on.
  analyzeMatchedVisitCore:
    class: lsst.analysis.tools.tasks.AssociatedSourcesTractAnalysisTask
    config:
      applyAstrometricCorrections: false
  sourceObjectMatch:
    class: lsst.analysis.tools.tasks.SourceObjectTableAnalysisTask
    config:
      applyAstrometricCorrections: false
  photometricRefCatObjectTract:
    class: lsst.analysis.tools.tasks.refCatObjectPhotometricAnalysis.RefCatObjectPhotometricAnalysisTask
    config:
      connections.outputName: "object_ref_match_photom"
